[project]
name = "bgem3-emb"
version = "0.1.0"
description = "BGE-M3 稠密向量 gRPC 推理引擎"
authors = [{name = "migo", email = "1695587905@qq.com"}]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.8.0", "transformers==4.57.6", "numpy>=2,<3",
  "grpcio==1.76.0", "protobuf>=6.31.1,<7", "typer>=0.15,<1", "pydantic>=2,<3",
]

[tool.poetry]
packages = [{include = "bgem3_emb", from = "src"}]
include = ["src/bgem3_emb/proto/*.proto"]

[tool.poetry.scripts]
bgem3-emb = "bgem3_emb.commands.app:app"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
pytest-asyncio = ">=0.24,<2"
ruff = ">=0.11,<1"
onnxruntime = "1.23.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["src/bgem3_emb/proto/*_pb2*", "src/bgem3_emb/proto/*_pb2_grpc*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
